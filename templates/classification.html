<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Классификация ирисов</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 20px; }
        nav { margin-bottom: 25px; padding-bottom: 10px; border-bottom: 1px solid #ccc; }
        nav a { margin-right: 15px; text-decoration: none; color: #0066cc; font-weight: bold; }
        label { display: block; margin-top: 12px; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 18px; padding: 10px 18px; cursor: pointer; background: #0066cc; color: white; border: none; border-radius: 4px; }
        .result { margin-top: 20px; padding: 15px; background: #e8f4fd; border-left: 4px solid #0066cc; }
    </style>
</head>
<body>
    <nav>
        <a href="/">1. Классификация (4 → 8 → 3)</a>
        <a href="/regression">2. Регрессия (3 → 8 → 1)</a>
    </nav>

    <h2>Классификация вида ириса</h2>
    <form method="post" action="/">
        <label>Длина чашелистика (см):
            <input type="number" step="0.1" name="sepal_length" value="{{ sepal_length if sepal_length is defined else '5.1' }}" required>
        </label>
        <label>Ширина чашелистика (см):
            <input type="number" step="0.1" name="sepal_width" value="{{ sepal_width if sepal_width is defined else '3.5' }}" required>
        </label>
        <label>Длина лепестка (см):
            <input type="number" step="0.1" name="petal_length" value="{{ petal_length if petal_length is defined else '1.4' }}" required>
        </label>
        <label>Ширина лепестка (см):
            <input type="number" step="0.1" name="petal_width" value="{{ petal_width if petal_width is defined else '0.2' }}" required>
        </label>
        <button type="submit">Определить вид</button>
    </form>

    {% if prediction is defined %}
    <div class="result">
        <p><strong>Предсказанный класс:</strong> {{ prediction }}</p>
        <p><small>Выходы сети: {{ probabilities }}</small></p>
    </div>
    {% endif %}
</body>
</html>
